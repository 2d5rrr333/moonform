<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moonform login demo</title>
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script>
    // tiye/react's render shim expects the React 19 client bundle on
    // globalThis.ReactDOMClient; React 18's UMD exposes createRoot on
    // ReactDOM directly — alias it.
    globalThis.ReactDOMClient = globalThis.ReactDOM;
  </script>
  <script src="main.js" defer></script>
</head>
<body>
  <main id="app"></main>
</body>
</html>
