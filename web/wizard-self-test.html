<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>moonform wizard demo (self-test)</title>
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script>
    globalThis.ReactDOMClient = globalThis.ReactDOM;
  </script>
  <script src="wizard.js" defer></script>
</head>
<body>
  <main id="app"></main>
  <!--
    Headless self-test harness for the multi-step group form:
    step 1 schema validation (distributed field errors) blocks "Next";
    fixing the values advances; step 2 dual-channel validation (group
    error for empty, field error for too-short) blocks "Finish"; the
    final group submit drives the whole-form submit.
  -->
  <script>
    window.__mf_test = async function () {
      const out = [];
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      await sleep(150);
      window.__mf_errors = [];
      window.addEventListener('error', (e) => window.__mf_errors.push(String(e.message)));
      await sleep(400);
      out.push('JSERRORS=' + JSON.stringify(window.__mf_errors));
      const app = document.getElementById('app');
      for (let i = 0; i < 50 && app && app.childElementCount === 0; i++) {
        await sleep(100);
      }
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      out.push('STEP1=' + ($('h2') ? $('h2').textContent : 'MISSING'));

      function setInput(el, text) {
        const setter = Object.getOwnPropertyDescriptor(
          window.HTMLInputElement.prototype,
          'value'
        ).set;
        setter.call(el, text);
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
      function clickButton(text) {
        const btn = $$('button').find((b) => b.textContent.trim() === text);
        if (btn) btn.click();
        return !!btn;
      }
      const visibleErrs = () =>
        $$('.err').map((e) => e.textContent.trim()).filter(Boolean);

      const username = $('#username');
      const email = $('#email');
      if (!username || !email) {
        out.push('FIELDS=MISSING');
        return finish(out);
      }

      // step 1: invalid input -> schema errors distribute to both fields
      setInput(username, 'ab'); // min_len(3)
      setInput(email, 'not-an-email');
      await sleep(200);
      const s1errs = visibleErrs();
      out.push('S1_INVALID_COUNT=' + s1errs.length);
      out.push('S1_INVALID_ERRS=' + JSON.stringify(s1errs));

      // "Next" is blocked while the group is invalid
      clickButton('Next');
      await sleep(200);
      out.push('AFTER_NEXT_INVALID=' + ($('h2') ? $('h2').textContent : 'MISSING'));

      // fix both -> errors clear -> "Next" advances to step 2
      setInput(username, 'moonbit');
      setInput(email, 'user@example.com');
      await sleep(200);
      out.push('S1_VALID_ERRS=' + JSON.stringify(visibleErrs()));
      clickButton('Next');
      await sleep(200);
      out.push('STEP2=' + ($('h2') ? $('h2').textContent : 'MISSING'));

      const nickname = $('#nickname');
      if (!nickname) {
        out.push('NICKNAME=MISSING');
        return finish(out);
      }

      // step 2: empty nickname -> group-level error blocks "Finish"
      clickButton('Finish');
      await sleep(200);
      const gErrs = visibleErrs();
      out.push('S2_GROUP_ERRS=' + JSON.stringify(gErrs));
      out.push('S2_STILL=' + ($('h2') ? $('h2').textContent : 'MISSING'));

      // too-short nickname -> field error
      setInput(nickname, 'mo');
      await sleep(200);
      out.push('S2_FIELD_ERRS=' + JSON.stringify(visibleErrs()));

      // valid nickname -> "Finish" submits the whole form asynchronously
      // (real-clock host adapter): in-flight state first, then completion
      setInput(nickname, 'moon');
      await sleep(200);
      clickButton('Finish');
      await sleep(250);
      const busy = $$('button').find((b) => b.textContent.trim() === 'Submitting...');
      out.push('SUBMITTING=' + (busy ? 'yes' : 'no'));
      out.push('SUBMIT_DISABLED=' + (busy ? String(busy.disabled) : 'n/a'));
      await sleep(900);
      out.push('OK=' + ($('.ok') ? $('.ok').textContent : 'MISSING'));
      return finish(out);
    };
    function finish(out) {
      var pre = document.createElement('pre');
      pre.id = 'test-summary';
      pre.textContent = out.join('\n');
      document.body.appendChild(pre);
      document.title = 'test-summary';
    }
    window.addEventListener('load', () => {
      setTimeout(window.__mf_test, 50);
    });
  </script>
</body>
</html>
