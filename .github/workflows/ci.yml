name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: Check (js/wasm/native) + fmt + build + interface drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain version
        run: |
          moon version --all >> "$GITHUB_STEP_SUMMARY"
          moon version --all
      - name: Update registry index
        run: moon update
      - name: Check (js)
        run: moon check --target js --deny-warn
      - name: Check (wasm)
        run: moon check --target wasm --deny-warn
      - name: Check (native)
        run: moon check --target native --deny-warn
      - name: Format check
        run: moon fmt --check
      - name: Build (js)
        run: moon build --target js
      - name: Build (wasm)
        run: moon build --target wasm
      - name: Build (native)
        run: moon build --target native
      - name: Interface drift guard (moon info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti' || {
            echo '::error::pkg.generated.mbti drifted — run "moon info" and commit the result'
            git diff -- '*.mbti'
            exit 1
          }

  test-js:
    name: Test (js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain version
        run: |
          moon version --all >> "$GITHUB_STEP_SUMMARY"
          moon version --all
      - name: Update registry index
        run: moon update
      - name: Test
        run: moon test --target js --deny-warn

  test-wasm:
    name: Test (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain version
        run: |
          moon version --all >> "$GITHUB_STEP_SUMMARY"
          moon version --all
      - name: Update registry index
        run: moon update
      - name: Test
        run: moon test --target wasm --deny-warn

  test-native:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain version
        run: |
          moon version --all >> "$GITHUB_STEP_SUMMARY"
          moon version --all
      - name: Update registry index
        run: moon update
      - name: Test
        run: moon test --target native --deny-warn

  example:
    name: Examples (login + roster + wizard + isomorphic + bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain version
        run: |
          moon version --all >> "$GITHUB_STEP_SUMMARY"
          moon version --all
      - name: Update registry index
        run: moon update
      - name: Run login example
        run: moon run src/examples/login --target js
      - name: Run roster example
        run: moon run src/examples/roster --target js
      - name: Run wizard example
        run: moon run src/examples/wizard --target js
      - name: Run isomorphic client example (js)
        run: moon run src/examples/isomorphic-client --target js
      - name: Run isomorphic server example (native)
        run: moon run src/examples/isomorphic-server --target native
      - name: Run performance bench (js, 500-field form)
        run: moon run src/examples/bench --target js
      - name: README quick-start verifier (against the PUBLISHED package)
        run: |
          # A fresh downstream project consuming a PUBLISHED moonform,
          # running the README's five quick-start blocks end-to-end.
          # Uses the version in moon.mod; if that version is not on the
          # registry yet (push raced ahead of `moon publish`), falls back
          # one patch with a visible warning. The check's purpose is
          # README vs published-API compatibility, not release sequencing.
          VER=$(grep '^version' moon.mod | sed 's/version *= *"\(.*\)"/\1/')
          setup() { rm -rf /tmp/readme-check && mkdir -p /tmp/readme-check/src
            cp "$GITHUB_WORKSPACE/src/readme-verify/moon.pkg" /tmp/readme-check/src/moon.pkg
            cp "$GITHUB_WORKSPACE/src/readme-verify/main.mbt" /tmp/readme-check/src/main.mbt; }
          try_version() {
            { echo 'name = "2d5rrr333/readme-check"'
              echo 'version = "0.1.0"'
              echo "import { \"2d5rrr333/moonform@$1\" }"
              echo 'source = "src"'
            } > /tmp/readme-check/moon.mod
            cd /tmp/readme-check && moon update && moon check --target js
          }
          setup
          if ! try_version "$VER"; then
            P1=$(echo "$VER" | awk -F. '$3>0 {print $1"."$2"."$3-1}')
            echo "::warning::moonform@$VER not on the registry yet — retrying with $P1 (publish before pushing; on a x.y.0 bump, re-run after publishing)"
            setup
            try_version "$P1"
          fi
          cd /tmp/readme-check && moon run src --target js
      - name: lens-gen CLI self-check (regenerate + diff)
        run: |
          moon run src/lens-gen-cli --target js -- src/examples/generated/pkg.generated.mbti -o /tmp/gen.mbt
          diff /tmp/gen.mbt src/examples/generated/profile_lenses.generated.mbt
